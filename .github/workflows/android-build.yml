name: Build Android debug APK
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify bundled offline HTML
        run: |
          npm run build:standalone
          git diff --exit-code -- app/CUBHMA_Mobile_Lab_Offline.html
      - name: Validate Android export bridge protocol
        run: |
          node --check android/app/src/main/assets/export-bridge.js
          node --test tests/android-export-bridge.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile Android shell and run native picker lifecycle unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Reject unsigned release build in public CI
        working-directory: android
        run: |
          set -euo pipefail
          if gradle --no-daemon :app:assembleRelease > "$RUNNER_TEMP/unsigned-release.log" 2>&1; then
            echo "Unsigned release build unexpectedly succeeded"
            exit 1
          fi
          if ! grep -q 'Release signing environment is incomplete' "$RUNNER_TEMP/unsigned-release.log"; then
            cat "$RUNNER_TEMP/unsigned-release.log"
            exit 1
          fi
      - name: Exercise signed release candidate with disposable CI-only key
        working-directory: android
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/cube-disposable-ci-keystore.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          TEMP_PASSWORD="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -alias cube-ci -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=Disposable CI Only" -keystore "$KEYSTORE" \
            -storepass "$TEMP_PASSWORD" -keypass "$TEMP_PASSWORD"
          export CUBE_RELEASE_KEYSTORE_PATH="$KEYSTORE"
          export CUBE_RELEASE_STORE_PASSWORD="$TEMP_PASSWORD"
          export CUBE_RELEASE_KEY_ALIAS="cube-ci"
          export CUBE_RELEASE_KEY_PASSWORD="$TEMP_PASSWORD"
          gradle --no-daemon :app:assembleRelease
          export CUBE_RELEASE_CERT_SHA256="$(keytool -list -v -keystore "$KEYSTORE" \
            -alias cube-ci -storepass "$TEMP_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)"
          test -n "$CUBE_RELEASE_CERT_SHA256"
          cd ..
          node scripts/verify-android-release.mjs \
            android/app/build/outputs/apk/release/app-release.apk \
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Verify debug APK identity, offline bytes, permissions and provenance
        run: |
          node --test tests/verify-android-apk.test.mjs
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          node scripts/verify-android-apk.mjs "$APK" "$AAPT"
      - uses: actions/upload-artifact@v4
        with:
          name: cube-mobile-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk.provenance.json
          if-no-files-found: error
