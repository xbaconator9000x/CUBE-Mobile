name: Build Android debug APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and verify bundled offline HTML
        run: |
          npm run build:standalone
          git diff --exit-code -- app/CUBHMA_Mobile_Lab_Offline.html
      - name: Validate Android export bridge protocol
        run: |
          node --check android/app/src/main/assets/export-bridge.js
          node --test tests/android-export-bridge.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile offline Android shell
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Inspect APK asset and ROM safety
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          test -n "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/index.html'
          if unzip -Z1 "$APK" | grep -Ei '\\.(gba|gbc|rom|sav|srm)
        with:
          name: cube-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cube-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
